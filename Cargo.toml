[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/scanner",
    "crates/graph",
    "crates/cache",
    "crates/llm",
    "crates/rag",
    "crates/index",
    "crates/analyzer",
    "crates/wiki",
    "crates/export",
    "crates/ingest",
    "crates/server",
    "crates/cli",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Generate comprehensive wiki documentation for any codebase from terminal or browser"
repository = "https://github.com/UnitBuilds-CC/RepoWiki"
homepage = "https://github.com/UnitBuilds-CC/RepoWiki"

[workspace.dependencies]
repowiki-core = { version = "0.5.0", path = "crates/core" }
repowiki-scanner = { version = "0.5.0", path = "crates/scanner" }
repowiki-graph = { version = "0.5.0", path = "crates/graph" }
repowiki-cache = { version = "0.5.0", path = "crates/cache" }
repowiki-llm = { version = "0.5.0", path = "crates/llm" }
repowiki-rag = { version = "0.5.0", path = "crates/rag" }
repowiki-index = { version = "0.5.0", path = "crates/index" }
repowiki-analyzer = { version = "0.5.0", path = "crates/analyzer" }
repowiki-wiki = { version = "0.5.0", path = "crates/wiki" }
repowiki-export = { version = "0.5.0", path = "crates/export" }
repowiki-ingest = { version = "0.5.0", path = "crates/ingest" }
repowiki-server = { version = "0.5.0", path = "crates/server" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2"
ignore = "0.4"
petgraph = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
toml = "0.8"
console = "0.15"
dialoguer = "0.11"
hex = "0.4"
